<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE — An Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #e8294a;
    --blush: #f4a0b0;
    --cream: #fff8f0;
    --deep: #1a0510;
    --gold: #c9914a;
    --mist: rgba(232,41,74,0.08);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--deep);
    font-family: 'Playfair Display', serif;
    cursor: none;
  }

  /* Custom cursor */
  #cursor {
    position: fixed; top: 0; left: 0;
    width: 18px; height: 18px;
    pointer-events: none; z-index: 9999;
    transition: transform 0.15s ease;
  }
  #cursor svg { width: 100%; height: 100%; }

  /* Canvas for particle hearts */
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* Background gradient pulse */
  .bg {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, #3d0820 0%, #1a0510 60%, #0a0208 100%);
    z-index: 0;
    animation: bgPulse 6s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
    animation: orbFloat linear infinite;
  }
  .orb1 { width: 500px; height: 500px; background: var(--rose); top: -100px; left: -100px; animation-duration: 22s; }
  .orb2 { width: 400px; height: 400px; background: #8b1a5e; bottom: -80px; right: -80px; animation-duration: 28s; animation-delay: -10s; }
  .orb3 { width: 300px; height: 300px; background: var(--gold); bottom: 20%; left: 30%; animation-duration: 18s; animation-delay: -5s; opacity: 0.10; }
  @keyframes orbFloat {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(40px, 30px) scale(1.05); }
    50%  { transform: translate(20px, 60px) scale(0.95); }
    75%  { transform: translate(-20px, 30px) scale(1.02); }
    100% { transform: translate(0, 0) scale(1); }
  }

  /* Main center content */
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    pointer-events: none;
  }

  /* Big heart SVG */
  .heart-center {
    position: relative;
    width: 220px; height: 200px;
    margin-bottom: 32px;
    animation: heartbeat 1.4s ease-in-out infinite;
  }
  .heart-center svg { width: 100%; height: 100%; }
  @keyframes heartbeat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.14); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.08); }
    70%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  /* Glow ring behind big heart */
  .heart-glow {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,41,74,0.35) 0%, transparent 70%);
    animation: glowPulse 1.4s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    42% { opacity: 1; transform: scale(1.12); }
  }

  /* Title */
  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(72px, 12vw, 140px);
    font-weight: 700;
    font-style: italic;
    color: transparent;
    background: linear-gradient(135deg, #f9c5d1 0%, var(--rose) 40%, var(--gold) 80%, #f9c5d1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    letter-spacing: -0.02em;
    line-height: 1;
    text-shadow: none;
    animation: titleShimmer 4s linear infinite, titleReveal 1.2s cubic-bezier(0.16,1,0.3,1) both;
    background-size: 200% 200%;
  }
  @keyframes titleShimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes titleReveal {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 2vw, 18px);
    font-style: italic;
    font-weight: 300;
    color: var(--blush);
    opacity: 0.7;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 16px;
    animation: fadeUp 1.4s 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 0.7; transform: translateY(0); }
  }

  /* Click hint */
  .hint {
    position: fixed;
    bottom: 36px;
    left: 50%; transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--blush);
    opacity: 0.4;
    letter-spacing: 0.2em;
    z-index: 20;
    animation: hintBlink 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes hintBlink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.15; }
  }

  /* Floating small hearts (CSS) */
  .float-hearts {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 2;
    overflow: hidden;
  }
  .fh {
    position: absolute;
    bottom: -60px;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  .fh svg { display: block; }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(1); opacity: 0; }
    10%  { opacity: 0.7; }
    80%  { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(var(--drift)) rotate(var(--spin)) scale(var(--end-scale)); opacity: 0; }
  }

  /* Ripple on click */
  .ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid var(--rose);
    pointer-events: none;
    z-index: 50;
    transform: translate(-50%, -50%) scale(0);
    opacity: 1;
    animation: rippleOut 0.9s ease-out forwards;
  }
  @keyframes rippleOut {
    to { transform: translate(-50%, -50%) scale(8); opacity: 0; }
  }

  /* Petal trails */
  .petal {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 0 60% 0 60%;
    background: var(--rose);
    pointer-events: none;
    z-index: 50;
    animation: petalFall linear forwards;
  }
  @keyframes petalFall {
    0%   { opacity: 0.9; transform: rotate(var(--rot)) scale(1); }
    100% { opacity: 0; transform: translate(var(--px), var(--py)) rotate(var(--rot2)) scale(0.3); }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- Custom cursor -->
<div id="cursor">
  <svg viewBox="0 0 24 22" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 21C12 21 2 13.5 2 7C2 4.2 4.2 2 7 2C9 2 10.8 3.1 12 4.7C13.2 3.1 15 2 17 2C19.8 2 22 4.2 22 7C22 13.5 12 21 12 21Z" fill="#e8294a" stroke="#f4a0b0" stroke-width="0.5"/>
  </svg>
</div>

<canvas id="canvas"></canvas>

<!-- Floating hearts (CSS) -->
<div class="float-hearts" id="floatHearts"></div>

<!-- Stage -->
<div class="stage">
  <div class="heart-center">
    <div class="heart-glow"></div>
    <svg viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="hg" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#f9c5d1"/>
          <stop offset="45%" stop-color="#e8294a"/>
          <stop offset="100%" stop-color="#7a0020"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M110 180 C110 180 20 120 20 65 C20 38 42 20 65 20 C80 20 93 28 110 45 C127 28 140 20 155 20 C178 20 200 38 200 65 C200 120 110 180 110 180Z"
        fill="url(#hg)" filter="url(#glow)"/>
      <!-- Shine -->
      <ellipse cx="78" cy="58" rx="18" ry="12" fill="white" opacity="0.18" transform="rotate(-30 78 58)"/>
    </svg>
  </div>

  <div class="title">Love</div>
  <div class="subtitle">move your cursor &nbsp;·&nbsp; click to bloom</div>
</div>

<div class="hint">✦ &nbsp; an infinite poem &nbsp; ✦</div>

<script>
// === CURSOR ===
const cursor = document.getElementById('cursor');
let mx = window.innerWidth/2, my = window.innerHeight/2;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = (mx - 9) + 'px';
  cursor.style.top  = (my - 9) + 'px';
});

// === CANVAS PARTICLE HEARTS ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
});

function heartPath(ctx, x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 10, size / 10);
  ctx.beginPath();
  ctx.moveTo(0, -3);
  ctx.bezierCurveTo(-5, -9, -10, -4, -10, 0);
  ctx.bezierCurveTo(-10, 5, 0, 10, 0, 10);
  ctx.bezierCurveTo(0, 10, 10, 5, 10, 0);
  ctx.bezierCurveTo(10, -4, 5, -9, 0, -3);
  ctx.closePath();
  ctx.restore();
}

const particles = [];
let mouseTrail = [];

function spawnParticle(x, y, burst = false) {
  const count = burst ? 14 : 1;
  for (let i = 0; i < count; i++) {
    const angle = burst ? (Math.PI * 2 * i / count) + Math.random() * 0.5 : Math.random() * Math.PI * 2;
    const speed = burst ? (2 + Math.random() * 5) : (0.5 + Math.random() * 1.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed * (burst ? 1 : 0.3),
      vy: Math.sin(angle) * speed - (burst ? 2 : 2 + Math.random() * 2),
      size: burst ? (6 + Math.random() * 14) : (4 + Math.random() * 8),
      alpha: 1,
      decay: burst ? 0.015 + Math.random() * 0.01 : 0.012 + Math.random() * 0.01,
      gravity: 0.06,
      hue: 340 + Math.random() * 30,
      sat: 70 + Math.random() * 30,
      light: 50 + Math.random() * 20,
      spin: (Math.random() - 0.5) * 0.15,
      rotation: Math.random() * Math.PI * 2,
      scale: 1,
    });
  }
}

// Trail spawn from mouse
let lastSpawnTime = 0;
document.addEventListener('mousemove', e => {
  const now = Date.now();
  if (now - lastSpawnTime > 40) {
    spawnParticle(e.clientX, e.clientY);
    lastSpawnTime = now;
  }
});

// Click burst
document.addEventListener('click', e => {
  spawnParticle(e.clientX, e.clientY, true);
  createRipple(e.clientX, e.clientY);
  createPetals(e.clientX, e.clientY);
});

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.alpha -= p.decay;
    p.rotation += p.spin;
    if (p.alpha <= 0) { particles.splice(i, 1); continue; }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = `hsl(${p.hue}, ${p.sat}%, ${p.light}%)`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsl(${p.hue}, 90%, 60%)`;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    heartPath(ctx, 0, 0, p.size);
    ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(animate);
}
animate();

// === RIPPLE ===
function createRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px';
  r.style.top  = y + 'px';
  r.style.width  = '40px';
  r.style.height = '40px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 900);
}

// === PETALS ===
function createPetals(x, y) {
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const angle = Math.random() * Math.PI * 2;
    const dist  = 60 + Math.random() * 120;
    const px = Math.cos(angle) * dist + 'px';
    const py = (Math.sin(angle) * dist + 80 + Math.random() * 60) + 'px';
    const hue = 330 + Math.random() * 30;
    p.style.cssText = `
      left: ${x}px; top: ${y}px;
      background: hsl(${hue}, 80%, 65%);
      --px: ${px}; --py: ${py};
      --rot:  ${Math.random() * 360}deg;
      --rot2: ${Math.random() * 720}deg;
      width: ${6 + Math.random() * 8}px;
      height: ${6 + Math.random() * 8}px;
      animation-duration: ${0.6 + Math.random() * 0.8}s;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1400);
  }
}

// === FLOATING CSS HEARTS ===
const floatContainer = document.getElementById('floatHearts');
const colors = ['#e8294a','#f4a0b0','#c9914a','#9b2f5e','#f9c5d1'];

function makeFloatHeart() {
  const fh = document.createElement('div');
  fh.className = 'fh';
  const size = 10 + Math.random() * 28;
  const color = colors[Math.floor(Math.random() * colors.length)];
  const left  = Math.random() * 100;
  const dur   = 8 + Math.random() * 14;
  const delay = Math.random() * 12;
  const drift = (Math.random() - 0.5) * 120 + 'px';
  const spin  = (Math.random() - 0.5) * 360 + 'deg';
  const escale = 0.3 + Math.random() * 0.9;

  fh.style.cssText = `
    left: ${left}%;
    --drift: ${drift};
    --spin:  ${spin};
    --end-scale: ${escale};
    animation-duration: ${dur}s;
    animation-delay: ${delay}s;
  `;
  fh.innerHTML = `<svg width="${size}" height="${size * 0.92}" viewBox="0 0 20 18.4">
    <path d="M10 17C10 17 1 11 1 5.5C1 3 3 1 5.5 1C7.1 1 8.5 1.9 10 3.5C11.5 1.9 12.9 1 14.5 1C17 1 19 3 19 5.5C19 11 10 17 10 17Z"
      fill="${color}" opacity="0.85"/>
  </svg>`;
  floatContainer.appendChild(fh);
  setTimeout(() => fh.remove(), (dur + delay) * 1000 + 500);
}

// Seed initial hearts
for (let i = 0; i < 22; i++) makeFloatHeart();
// Keep spawning
setInterval(makeFloatHeart, 900);

// === CURSOR SCALE ON CLICK ===
document.addEventListener('mousedown', () => cursor.style.transform = 'scale(1.5)');
document.addEventListener('mouseup',   () => cursor.style.transform = 'scale(1)');
</script>
</body>
        </html>
